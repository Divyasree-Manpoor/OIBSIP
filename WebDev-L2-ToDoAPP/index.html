<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A responsive task management application."
    >

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->

        <header class="app-header">

            <div>
                <p class="eyebrow">TASK MANAGEMENT</p>

                <h1>My Tasks</h1>

                <p class="subtitle">
                    Organize your day, one task at a time.
                </p>
            </div>

        </header>


        <!-- Add Task -->

        <section class="task-input-section">

            <form id="taskForm" class="task-form">

                <label
                    for="taskInput"
                    class="sr-only"
                >
                    Enter a task
                </label>

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                    maxlength="150"
                >

                <button
                    type="submit"
                    class="add-button"
                >
                    Add Task
                </button>

            </form>

        </section>


        <!-- Task Summary -->

        <section class="task-summary">

            <div class="summary-item">

                <span class="summary-label">
                    Total
                </span>

                <strong id="totalCount">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span class="summary-label">
                    Pending
                </span>

                <strong id="pendingCount">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span class="summary-label">
                    Completed
                </span>

                <strong id="completedCount">
                    0
                </strong>

            </div>

        </section>


        <!-- Task Controls -->

        <section class="task-controls">

            <div
                class="filter-buttons"
                role="group"
                aria-label="Task filters"
            >

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="pending"
                >
                    Pending
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- Task List -->

        <section class="tasks-section">

            <div
                id="emptyState"
                class="empty-state"
            >

                <div class="empty-icon">
                    ✓
                </div>

                <h2>No tasks yet</h2>

                <p>
                    Add your first task to get started.
                </p>

            </div>


            <ul
                id="taskList"
                class="task-list"
                aria-live="polite"
            >
            </ul>

        </section>


        <!-- Footer -->

        <footer class="app-footer">

            <p>
                Your tasks are saved automatically in this browser.
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
