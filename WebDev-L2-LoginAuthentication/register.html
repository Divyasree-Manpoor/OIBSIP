<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create an account for the authentication system."
    >

    <title>Create Account</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- Brand -->

            <div class="brand">

                <div class="brand-icon">
                    🔐
                </div>

                <h1>Create Account</h1>

                <p>
                    Register to get started
                </p>

            </div>


            <!-- Registration Form -->

            <form
                id="registerForm"
                class="auth-form"
            >

                <!-- Username / Email -->

                <div class="form-group">

                    <label for="registerIdentifier">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="registerIdentifier"
                        placeholder="Enter your username or email"
                        autocomplete="username"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Minimum 8 characters"
                        autocomplete="new-password"
                        maxlength="100"
                        required
                    >

                    <small class="field-hint">
                        Minimum 8 characters with at least 1 number.
                    </small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        maxlength="100"
                        required
                    >

                </div>


                <!-- Registration Message -->

                <p
                    id="registerMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login Link -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="index.html">
                        Sign in
                    </a>
                </p>

            </div>

        </section>

    </main>


    <script src="auth.js"></script>

</body>

</html>
