<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | Oasis Infobyte</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <div class="calculator">

           <div class="calculator-header">
    <h1>Calculator</h1>
    <p>Simple and powerful calculator</p>
</div>

            <div class="display-container">
                <div id="previous-display" class="previous-display"></div>
                <div id="current-display" class="current-display">0</div>
            </div>

            <div class="calculator-buttons">

                <button type="button" class="button button-clear" data-action="clear">
                    C
                </button>

                <button type="button" class="button button-delete" data-action="delete">
                    DEL
                </button>

                <button type="button" class="button button-operator" data-operator="÷">
                    ÷
                </button>

                <button type="button" class="button button-operator" data-operator="×">
                    ×
                </button>


                <button type="button" class="button" data-number="7">
                    7
                </button>

                <button type="button" class="button" data-number="8">
                    8
                </button>

                <button type="button" class="button" data-number="9">
                    9
                </button>

                <button type="button" class="button button-operator" data-operator="−">
                    −
                </button>


                <button type="button" class="button" data-number="4">
                    4
                </button>

                <button type="button" class="button" data-number="5">
                    5
                </button>

                <button type="button" class="button" data-number="6">
                    6
                </button>

                <button type="button" class="button button-operator" data-operator="+">
                    +
                </button>


                <button type="button" class="button" data-number="1">
                    1
                </button>

                <button type="button" class="button" data-number="2">
                    2
                </button>

                <button type="button" class="button" data-number="3">
                    3
                </button>

                <button type="button" class="button button-equals" data-action="equals">
                    =
                </button>


                <button type="button" class="button button-zero" data-number="0">
                    0
                </button>

                <button type="button" class="button" data-number=".">
                    .
                </button>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
